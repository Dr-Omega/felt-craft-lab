<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小小贴纸屋</title>
    <link rel="stylesheet" href="/app/styles.css?v=12" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">贴纸匹配小游戏 · 测试版</p>
          <h1>把贴纸送回正确的位置</h1>
        </div>
      </header>

      <section class="level-picker" aria-label="关卡选择">
        <label for="levelSelect">选择关卡</label>
        <select id="levelSelect" aria-label="按主题选择关卡"></select>
        <span id="themeLabel" class="theme-label"></span>
      </section>

      <section class="game-layout" aria-label="贴纸匹配游戏">
        <div class="board-panel">
          <div class="board-heading">
            <span id="statusText">正在准备关卡...</span>
            <span id="levelLabel" class="level-label"></span>
          </div>
          <div id="board" class="board" aria-label="背景画布"></div>
          <p class="hint">拖动右侧贴纸，放到背景上的虚线轮廓里</p>
        </div>
        <aside class="sticker-panel">
          <div class="panel-heading">
            <h2>贴纸</h2>
            <span>拖动试试</span>
          </div>
          <div id="stickerTray" class="sticker-tray"></div>
        </aside>
      </section>
    </main>
    <div id="celebration" class="celebration" hidden>
      <div class="celebration-card">
        <button id="closeCelebration" class="close" type="button" aria-label="关闭">×</button>
        <p class="celebration-kicker">全部完成</p>
        <video id="celebrationVideo" playsinline></video>
      </div>
    </div>
    <script src="/app/app.js?v=13" type="module"></script>
  </body>
</html>
